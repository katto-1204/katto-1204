name: Generate Metrics
on:
  # Update automatically every 24 hours
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories, metadata
          # You can customize these plugins based on the screenshot
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_followup: yes
          plugin_followup_sections: repositories

      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-right-1.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_lines: yes
          plugin_languages: yes
          # "recently-used", plugin_activity, plugin_habits, and plugin_achievements
          # are broken in lowlighter/metrics@latest due to GitHub removing
          # PushEvent.payload.commits and sunsetting Classic Projects in GraphQL.
          plugin_languages_sections: most-used
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_repositories: yes
          plugin_repositories_featured: katto-1204/katto-1204

      - name: Generate ASCII Skyline
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          git pull --rebase origin main
          gh extension list | grep -q 'github/gh-skyline' || gh extension install github/gh-skyline
          gh skyline --user katto-1204 --art-only > skyline.txt
          python3 - <<'EOF'
          import re

          with open("skyline.txt", "r", encoding="utf-8") as f:
              skyline = f.read().rstrip("\n")
          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          ansi_escape = re.compile(r"\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])")
          skyline = ansi_escape.sub("", skyline)
          replacement = f"<!-- skyline start -->\n<pre>\n{skyline}\n</pre>\n<!-- skyline end -->"
          readme = re.sub(
              r"<!-- skyline start -->.*<!-- skyline end -->",
              lambda _: replacement,
              readme,
              flags=re.DOTALL,
          )
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          EOF
          rm -f skyline.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub Skyline ASCII Art [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
